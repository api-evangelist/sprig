name: Sprig
description: >-
  Sprig is a continuous product-research platform that helps teams automatically
  capture user insights to improve their product, user experience, and marketing.
  Sprig delivers in-product studies and surveys to specific users at specific
  moments across web and mobile, then uses AI to synthesize responses into themes.
  For developers, Sprig ships a REST API (api.sprig.com) to export studies,
  responses, and themes and to manage users, web/mobile SDKs (JavaScript, iOS,
  Android, React Native, Flutter), a webhook event surface, and an official hosted
  MCP server for AI clients. Formerly UserLeap.
